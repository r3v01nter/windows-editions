<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='1' width='6' height='6' rx='1' fill='%232B88D8'/><rect x='9' y='1' width='6' height='6' rx='1' fill='%230078D4'/><rect x='1' y='9' width='6' height='6' rx='1' fill='%230078D4'/><rect x='9' y='9' width='6' height='6' rx='1' fill='%232B88D8'/></svg>">
<title>Windows OS 资料库</title>
<style>
  /* ==========================================================================
     Light Theme (浅色极简毛玻璃)
     ========================================================================== */
  :root {
    --bg-base: #f1f5f9;       
    --text-main: #0f172a;     
    --text-muted: #475569;    
    --text-faint: #94a3b8;    
    
    --glass-bg: rgba(255, 255, 255, 0.75);
    --glass-border: rgba(255, 255, 255, 0.9);
    --glass-shadow: 0 4px 24px rgba(15, 23, 42, 0.03);
    
    --accent-blue: #0ea5e9;
    --diff-red: #ef4444;      
    --neon-green: #10b981;    
    
    --hover-bg: rgba(255, 255, 255, 0.95);
    --switch-bg: rgba(255, 255, 255, 0.4);
    --switch-active: rgba(255, 255, 255, 0.9);
    
    --c-home: #3b82f6; --c-home-bg: rgba(59, 130, 246, 0.08);
    --c-pro:  #8b5cf6; --c-pro-bg:  rgba(139, 92, 246, 0.08);
    --c-ws:   #f59e0b; --c-ws-bg:   rgba(245, 158, 11, 0.08);
    --c-ent:  #10b981; --c-ent-bg:  rgba(16, 185, 129, 0.08);
    --c-edu:  #06b6d4; --c-edu-bg:  rgba(6, 182, 212, 0.08);
    --c-pedu: #d946ef; --c-pedu-bg: rgba(217, 70, 239, 0.08);
    --c-ltsc: #65a30d; --c-ltsc-bg: rgba(101, 163, 13, 0.08);
    --c-iot:  #f97316; --c-iot-bg:  rgba(249, 115, 22, 0.08);
  }

  /* ==========================================================================
     Dark Theme (深色毛玻璃映射)
     ========================================================================== */
  [data-theme="dark"] {
    --bg-base: #0b0f19;       
    --text-main: #f8fafc;     
    --text-muted: #cbd5e1;    
    --text-faint: #64748b;    
    
    --glass-bg: rgba(15, 23, 42, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    
    --accent-blue: #38bdf8;
    --diff-red: #f87171;
    --neon-green: #34d399;

    --hover-bg: rgba(30, 41, 59, 0.95);
    --switch-bg: rgba(0, 0, 0, 0.4);
    --switch-active: rgba(255, 255, 255, 0.12);

    --c-home-bg: rgba(59, 130, 246, 0.15);
    --c-pro-bg:  rgba(139, 92, 246, 0.15);
    --c-ws-bg:   rgba(245, 158, 11, 0.15);
    --c-ent-bg:  rgba(16, 185, 129, 0.15);
    --c-edu-bg:  rgba(6, 182, 212, 0.15);
    --c-pedu-bg: rgba(217, 70, 239, 0.15);
    --c-ltsc-bg: rgba(101, 163, 13, 0.15);
    --c-iot-bg:  rgba(249, 115, 22, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-base);
    color: var(--text-main);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow: hidden; 
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  /* 动态光晕 */
  .ambient-orb {
    position: fixed; border-radius: 50%; z-index: -1; pointer-events: none;
    transform: translateZ(0); animation: floatOrb 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
    transition: opacity 0.5s ease;
  }
  .orb-1 { top: -20%; left: -10%; width: 70vw; height: 70vw; background: radial-gradient(circle closest-side, rgba(14, 165, 233, 0.12), transparent); }
  .orb-2 { bottom: -30%; right: -10%; width: 80vw; height: 80vw; background: radial-gradient(circle closest-side, rgba(167, 139, 250, 0.12), transparent); animation-delay: -5s; animation-direction: alternate-reverse; }
  [data-theme="dark"] .ambient-orb { opacity: 0.6; }
  @keyframes floatOrb { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(5%, 5%, 0) scale(1.05); } }

  .glass { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease; }

  .source-bar {
    margin-top: 24px; padding: 12px 14px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px;
    background: var(--switch-bg); border: 1px solid var(--glass-border); border-radius: 14px;
    color: var(--text-muted); font-size: 11.5px; line-height: 1.5;
  }
  .source-bar strong { color: var(--text-main); font-weight: 800; }
  .source-bar a { color: var(--accent-blue); font-weight: 700; text-decoration: none; }
  .source-bar a:hover { text-decoration: underline; }
  .source-bar .source-note { flex-basis: 100%; color: var(--text-faint); }

  :focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent-blue) 60%, transparent);
    outline-offset: 3px;
  }

  @supports not ((backdrop-filter: blur(1px))) {
    .glass, .tool-group, .m-text-tabs, .td-first { background: var(--hover-bg); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
  
  .gpu-card { position: relative; border-radius: 20px; transform: translate3d(0, 0, 0); will-change: transform; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s ease; z-index: 1; }
  .gpu-card::after { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--hover-bg); box-shadow: 0 16px 32px rgba(0, 0, 0, 0.15); opacity: 0; will-change: opacity; transition: opacity 0.3s ease; }
  .gpu-card:hover { transform: translate3d(0, -4px, 0); border-color: var(--accent-blue); }
  .gpu-card:hover::after { opacity: 1; }

  .view-fade { animation: fadeSlideIn 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; will-change: opacity, transform; }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translate3d(0, 10px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }

  .svg-icon { stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* ==========================================================================
     悬浮工具栏 (包含绿点特效)
     ========================================================================== */
  .tools-bar { position: fixed; top: 24px; right: 32px; z-index: 100; display: flex; align-items: center; gap: 8px; flex-direction: row; transition: all 0.4s ease; }
  
  .tool-group {
    display: flex; align-items: center; gap: 4px; flex-direction: row;
    background: var(--switch-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border); border-radius: 99px;
    padding: 6px; box-shadow: var(--glass-shadow); transition: opacity 0.3s ease, flex-direction 0.3s ease;
  }
  .ts-btn, .lang-btn {
    position: relative; width: 36px; height: 36px; border-radius: 50%;
    border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; cursor: pointer; 
    transition: color 0.3s ease, background-color 0.3s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .ts-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  
  .ts-btn:hover, .lang-btn:hover { color: var(--text-main); }
  .ts-btn.active, .lang-btn.active { background: var(--switch-active); color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  
  /* 绿点上浮特效 */
  .ts-btn.active svg { transform: translateY(-3px); }
  .ts-btn::after {
    content: ''; position: absolute; bottom: 5px; left: 50%; width: 4px; height: 4px; border-radius: 50%;
    background-color: var(--neon-green); box-shadow: 0 0 6px var(--neon-green), 0 0 3px var(--neon-green);
    transform: translateX(-50%) scale(0); opacity: 0; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
  }
  .ts-btn.active::after { transform: translateX(-50%) scale(1); opacity: 1; }

  /* ==========================================================================
     门户视图 (Portal - 修正重心偏上)
     ========================================================================== */
  #portal-view { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 12vh 24px 24px; z-index: 10; position: relative; overflow-y: auto;}
  .portal-header { text-align: center; margin-bottom: 40px; }
  .portal-header h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 10px; }
  .portal-header p { color: var(--text-muted); font-size: 1.1rem; font-weight: 600; max-width: 500px; line-height: 1.6; margin: 0 auto; padding: 0 12px;}

  .bento-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 380px)); justify-content: center; gap: 20px; width: 100%; max-width: 800px; }
  .bento-card { display: flex; flex-direction: row; align-items: center; gap: 20px; padding: 24px; cursor: pointer; text-align: left; }
  .bento-card-info h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.5px;}
  .bento-card-info p { color: var(--text-muted); font-size: 0.85rem; font-weight: 500; line-height: 1.4; margin: 0;}
  .card-icon { width: 44px; height: 44px; flex-shrink: 0; color: var(--accent-blue); display: flex; align-items: center; justify-content: center; background: var(--switch-bg); border-radius: 12px; border: 1px solid var(--glass-border);}

  /* ==========================================================================
     应用主视图 (App Dashboard)
     ========================================================================== */
  #app-view { display: none; height: 100vh; width: 100%; max-width: 1600px; margin: 0 auto; z-index: 10; position: relative; }
  
  .desktop-sidebar {
    width: 260px; height: 100%; padding: 32px 24px; display: flex; flex-direction: column; gap: 32px;
    border-right: 1px solid var(--glass-border); background: var(--switch-bg); backdrop-filter: blur(12px);
  }
  .sidebar-logo { cursor: pointer; transition: opacity 0.2s; }
  .sidebar-logo:hover { opacity: 0.7; }
  .sidebar-logo h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  .sidebar-logo span { color: var(--text-faint); font-size: 12px; font-weight: 600; }
  
  .nav-menu { display: flex; flex-direction: column; gap: 8px; }
  .nav-btn { text-align: left; padding: 12px 18px; border-radius: 12px; border: none; background: transparent; color: var(--text-muted); font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
  .nav-btn:hover { background: var(--switch-active); color: var(--text-main); }
  .nav-btn.active { background: var(--switch-active); color: var(--accent-blue); box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--glass-border);}

  .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; transform: translateZ(0); }
  
  .top-chips-area { padding: 24px 32px 12px; display: flex; gap: 10px; align-items: center; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
  .top-chips-area::-webkit-scrollbar { display: none; }
  .chip {
    display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 99px;
    font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s ease;
    border: 1px solid var(--glass-border); background: var(--switch-bg); color: var(--text-muted);
    white-space: nowrap; flex-shrink: 0;
  }
  .chip:hover { background: var(--switch-active); color: var(--text-main);}
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  
  .chip.home.active { border-color: var(--c-home); color: var(--c-home); background: var(--c-home-bg); } .chip.home .dot { background: var(--c-home); }
  .chip.pro.active  { border-color: var(--c-pro);  color: var(--c-pro);  background: var(--c-pro-bg);  } .chip.pro .dot  { background: var(--c-pro); }
  .chip.ws.active   { border-color: var(--c-ws);   color: var(--c-ws);   background: var(--c-ws-bg);   } .chip.ws .dot   { background: var(--c-ws); }
  .chip.ent.active  { border-color: var(--c-ent);  color: var(--c-ent);  background: var(--c-ent-bg);  } .chip.ent .dot  { background: var(--c-ent); }
  .chip.edu.active  { border-color: var(--c-edu);  color: var(--c-edu);  background: var(--c-edu-bg);  } .chip.edu .dot  { background: var(--c-edu); }
  .chip.pedu.active { border-color: var(--c-pedu); color: var(--c-pedu); background: var(--c-pedu-bg); } .chip.pedu .dot { background: var(--c-pedu); }
  .chip.ltsc.active { border-color: var(--c-ltsc); color: var(--c-ltsc); background: var(--c-ltsc-bg); } .chip.ltsc .dot { background: var(--c-ltsc); }
  .chip.iot.active  { border-color: var(--c-iot);  color: var(--c-iot);  background: var(--c-iot-bg);  } .chip.iot .dot  { background: var(--c-iot); }
  .chip.inactive { opacity: 0.35; border-color: transparent; }

  .view-container { flex: 1; overflow-y: auto; padding: 16px 40px 40px; -webkit-overflow-scrolling: touch; }
  .view-container::-webkit-scrollbar { width: 6px; }
  .view-container::-webkit-scrollbar-thumb { background: rgba(150,150,150,0.2); border-radius: 3px; }

  .m-text-tabs { display: none; }

  /* ==========================================================================
     模块样式 (详情 / 卡片 / 表格 / 时间线 / 向导)
     ========================================================================== */
  .detail-card { max-width: 800px; margin: 0 auto; overflow: hidden; padding: 40px; text-align: left; border-radius: 20px; }
  .detail-header-flex { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .detail-name { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 2px; }
  .detail-sub { font-size: 13px; color: var(--text-muted); font-weight: 600; }
  
  .detail-nav-pill { display: inline-flex; align-items: center; background: var(--switch-bg); border: 1px solid var(--glass-border); border-radius: 99px; padding: 3px; }
  .d-nav-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--hover-bg); color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--glass-border); transition: all 0.2s; }
  .d-nav-btn:hover { color: var(--accent-blue); transform: scale(1.05); }
  .d-nav-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.5; fill: none; }
  .d-nav-count { font-size: 12px; font-weight: 800; color: var(--text-muted); padding: 0 12px; font-variant-numeric: tabular-nums;}

  .specs-row { display: flex; flex-direction: row; background: var(--switch-bg); border-radius: 12px; border: 1px solid var(--glass-border); margin-bottom: 20px; }
  .spec-item { flex: 1; padding: 10px 8px; text-align: center; border-right: 1px solid rgba(150,150,150,0.1); }
  .spec-item:last-child { border-right: none; }
  .spec-v { font-size: 16px; font-weight: 800; color: var(--text-main); }
  .spec-l { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-top: 2px; }

  .cards-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; align-items: stretch; }
  .ed-card { flex: 1 1 300px; max-width: 400px; padding: 24px; display: flex; flex-direction: column; text-align: left; }
  .ed-name { font-size: 18px; font-weight: 800; margin-bottom: 2px; }
  
  .feat-title { font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; color: var(--text-main); padding-bottom: 4px; border-bottom: 1px solid rgba(150,150,150,0.1); display: flex; justify-content: space-between; align-items: center;}
  .feat-title .diff-badge { font-size: 9px; background: rgba(239, 68, 68, 0.1); color: var(--diff-red); padding: 1px 6px; border-radius: 99px; }
  
  .feat-item { font-size: 12.5px; font-weight: 600; color: var(--text-muted); padding: 3px 0 3px 12px; position: relative; transition: color 0.2s; }
  .feat-item::before { content: ""; position: absolute; left: 0; top: 10px; width: 3px; height: 3px; border-radius: 50%; background: var(--text-faint); }
  .feat-item.is-diff { color: var(--text-main); font-weight: 700; }
  .feat-item.is-diff::before { display: none; }
  .diff-dot { position: absolute; left: -2px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--diff-red); box-shadow: 0 0 4px rgba(239, 68, 68, 0.5); }

  .table-wrap { width: 100%; overflow: auto; border-radius: 20px; padding: 0; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  th { position: sticky; top: 0; background: var(--hover-bg); backdrop-filter: blur(8px); padding: 12px 14px; font-weight: 800; z-index: 10; border-bottom: 2px solid rgba(150,150,150,0.1); color: var(--text-main); }
  .th-first { left: 0; z-index: 11; text-align: left; width: 120px; min-width: 120px; border-right: 1px solid rgba(150,150,150,0.1); border-top-left-radius: 20px;}
  th:last-child { border-top-right-radius: 20px; }
  td { padding: 8px 12px; text-align: center; color: var(--text-muted); border-bottom: 1px solid rgba(150,150,150,0.05); background: var(--switch-bg); }
  .td-first { position: sticky; left: 0; z-index: 5; text-align: left; font-weight: 700; color: var(--text-main); background: var(--glass-bg); backdrop-filter: blur(8px); border-right: 1px solid rgba(150,150,150,0.1); }
  .ic-y { color: #10b981; font-weight: 900; } .ic-n { color: #94a3b8; font-weight: 700;}
  .row-cat td { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); padding: 12px 12px 6px; background: rgba(150,150,150,0.05) !important; border-bottom: none; }

  .timeline-container { max-width: 760px; margin: 0 auto; padding-top: 16px; }
  .timeline-item { display: flex; gap: 20px; position: relative; padding-bottom: 32px; }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-line { position: absolute; left: 7px; top: 28px; bottom: -8px; width: 2px; background: rgba(150,150,150,0.15); }
  .timeline-dot { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--accent-blue); background: var(--hover-bg); z-index: 2; position: relative; margin-top: 4px; flex-shrink: 0;}
  .ver-tl-inline { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; border-bottom: 2px solid rgba(150,150,150,0.08); padding-bottom: 10px; }
  .ver-tl-label { font-size: 18px; font-weight: 800; }
  .ver-tl-date { font-size: 12px; color: var(--text-faint); font-weight: 700; }
  .ver-name { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
  .ver-badge { font-size: 10px; padding: 2px 10px; border-radius: 6px; font-weight: 700; background: var(--switch-bg); color: var(--text-main); border: 1px solid var(--glass-border); display: inline-block; margin-bottom: 16px;}
  .ver-note, .detail-note { margin-top: 16px; font-size: 12.5px; color: var(--text-muted); padding: 12px 16px; background: var(--switch-bg); border-radius: 10px; border: 1px solid var(--glass-border); line-height: 1.5; font-weight: 500; }

  .wizard-card { max-width: 600px; width: 100%; padding: 32px; text-align: center; border-radius: 20px;}
  .wiz-progress { height: 6px; background: rgba(150,150,150,0.1); border-radius: 3px; margin-bottom: 32px; overflow: hidden; }
  .wiz-progress-bar { height: 100%; background: var(--accent-blue); border-radius: 3px; transition: width 0.4s ease; }
  .wiz-q { font-size: 1.2rem; font-weight: 800; color: var(--text-main); margin-bottom: 24px; line-height: 1.4; }
  .wiz-opts { display: flex; flex-direction: column; gap: 12px; }
  .wiz-opt { padding: 14px 20px; background: var(--switch-bg); border: 1px solid var(--glass-border); border-radius: 14px; color: var(--text-main); font-size: 14px; font-weight: 700; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; transition: transform 0.2s, background 0.2s;}

  /* ==========================================================================
     移动端排版优化 (极客谷歌风：悬浮工具沉底，文字导航栏)
     ========================================================================== */
  @media (max-width: 768px) {
    /* 核心逻辑：工具栏位移 */
    /* 默认在首页：顶部横排 */
    .tools-bar { top: 16px; right: 16px; bottom: auto; flex-direction: row; gap: 6px; z-index: 1000; }
    .tool-group { flex-direction: row; padding: 4px 6px; }
    
    /* 核心逻辑：进入详情后：底部竖排 */
    body.in-app .tools-bar { top: auto; bottom: 24px; right: 16px; flex-direction: column; gap: 12px; }
    body.in-app .tool-group { flex-direction: column; padding: 6px 4px; }
    
    .ts-btn, .lang-btn { width: 32px; height: 32px; font-size: 11.5px;}
    .ts-btn svg { width: 14px; height: 14px; }
    .ts-btn::after { bottom: 3px; width: 3px; height: 3px; }

    #portal-view { padding-top: 12vh; justify-content: flex-start; }
    .portal-header h1 { font-size: 2.6rem; letter-spacing: -1px; }
    .ambient-orb { animation-duration: 30s; opacity: 0.75; }
    .portal-header p { font-size: 0.95rem; margin-bottom: 12px;}

function applyLanguage(newLang) {
  lang = newLang;
  document.querySelectorAll('.lang-btn').forEach(btn => {
    if(btn.dataset.lang === lang) btn.classList.add('active');
    else btn.classList.remove('active');
  });

  document.getElementById('t-portal-desc').innerText = dict[lang].portalDesc;
  document.getElementById('t-win11-desc').innerText = dict[lang].win11Desc;
  document.getElementById('t-win10-desc').innerText = dict[lang].win10Desc;
  document.getElementById('t-sidebar-meta').innerText = dict[lang].sidebarMeta;

  document.getElementById('d-btn-detail').innerText = dict[lang].nav.detail;
  document.getElementById('d-btn-cards').innerText = dict[lang].nav.cards;
  document.getElementById('d-btn-table').innerText = dict[lang].nav.table;
  document.getElementById('d-btn-version').innerText = dict[lang].nav.version;
  document.getElementById('d-btn-wizard').innerText = dict[lang].nav.wizard;
  
  document.getElementById('m-btn-detail').innerText = dict[lang].nav.detail;
  document.getElementById('m-btn-cards').innerText = dict[lang].nav.cards;
  document.getElementById('m-btn-table').innerText = dict[lang].nav.table;
  document.getElementById('m-btn-version').innerText = dict[lang].nav.version;
  document.getElementById('m-btn-wizard').innerText = dict[lang].nav.wizard;

  if (currentOs) {
    activeData = db[lang][currentOs];
    renderChips();
    renderView();
  }
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
});

function applyTheme(theme) {
  if (theme === 'system') {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
  document.querySelectorAll('.ts-btn').forEach(btn => {
    if(btn.dataset.themeVal === theme) btn.classList.add('active');
    else btn.classList.remove('active');
  });
  localStorage.setItem('win-os-theme', theme);
}

document.querySelectorAll('.ts-btn').forEach(btn => {
  btn.addEventListener('click', () => applyTheme(btn.dataset.themeVal));
});

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (localStorage.getItem('win-os-theme') === 'system') applyTheme('system');
});

const userLang = navigator.language || navigator.userLanguage;
applyLanguage(userLang.startsWith('zh') ? 'zh' : 'en');
applyTheme(localStorage.getItem('win-os-theme') || 'system');

window.addEventListener('DOMContentLoaded', () => {
  const hash = window.location.hash.replace(/^#/, '');
  const match = hash.match(/^(win10|win11)-(detail|cards|table|version|wizard)$/);
  if (match) {
    const [, os, view] = match;
    openApp(os, true);
    if (view !== 'detail') switchView(view, true);
    history.replaceState({ page: 'app', os, view }, '', window.location.pathname + window.location.search + window.location.hash);
  } else {
    history.replaceState({ page: 'portal' }, '', window.location.pathname + window.location.search);
  }
});

window.addEventListener('popstate', (e) => {
  const state = e.state;
  if (!state || state.page === 'portal') {
    goHome(true); 
  } else if (state.page === 'app') {
    if (currentOs !== state.os) { openApp(state.os, true); }
    switchView(state.view, true); 
  }
});

function openApp(osType, isHistoryAction = false) {
  activeData = db[lang][osType];
  currentOs = osType;
  selected = new Set(['home']);
  detailKey = 'home';
  currentView = 'detail';
  
  document.body.classList.add('in-app');
  document.getElementById('portal-view').style.display = 'none';
  document.getElementById('app-view').style.display = 'flex';
  
  document.getElementById('d-topbar-title').innerText = activeData.title;
  
  renderChips();
  
  if (!isHistoryAction) {
    history.pushState({ page: 'app', os: osType, view: 'detail' }, '', '#' + osType + '-detail');
  }
  switchView('detail', true); 
}

function goHome(isHistoryAction = false) {
  currentOs = null;
  document.body.classList.remove('in-app');
  document.getElementById('app-view').style.display = 'none';
  document.getElementById('portal-view').style.display = 'flex';

  if (!isHistoryAction) {
    history.pushState({ page: 'portal' }, '', window.location.pathname + window.location.search);
  }
}

function renderChips() {
  document.getElementById('chip-container').innerHTML = activeData.order.map(k => 
    `<button class="chip ${k} active glass" onclick="onChip('${k}')"><span class="dot"></span>${activeData.labels[k]}</button>`
  ).join('');
}

function onChip(key) {
  if (currentView === 'version' || currentView === 'wizard') return;
  if (currentView === 'detail') {
    detailKey = key;
    selected = new Set([key]);
  } else {
    if (selected.has(key)) { if (selected.size > 1) selected.delete(key); } 
    else { selected.add(key); }
  }
  updateChipsState();
  renderView();
}

function updateChipsState() {
  activeData.order.forEach(k => {
    const btn = document.querySelector('.chip.' + k);
    if (!btn) return;
    if (currentView === 'detail') { btn.className = `chip ${k} glass ${k === detailKey ? 'active' : 'inactive'}`; } 
    else { btn.className = `chip ${k} glass ${selected.has(k) ? 'active' : 'inactive'}`; }
  });
}

function switchView(v, isHistoryAction = false) {
  if (currentView === 'detail' && v !== 'detail') selected = new Set([detailKey]);
  if (v === 'detail' && currentView !== 'detail') { detailKey = Array.from(selected)[0]; selected = new Set([detailKey]); }
  currentView = v;
  
  ['detail','cards','table','version','wizard'].forEach(id => {
    const dBtn = document.getElementById(`d-btn-${id}`);
    const mBtn = document.getElementById(`m-btn-${id}`);
    if(dBtn) dBtn.className = `nav-btn ${v === id ? 'active' : ''}`;
    if(mBtn) mBtn.className = `m-tab-btn ${v === id ? 'active' : ''}`;
  });
  
  document.getElementById('chip-container').style.display = (v === 'version' || v === 'wizard') ? 'none' : 'flex';
  updateChipsState();
  renderView();
  
  if (!isHistoryAction && currentOs) {
    history.pushState({ page: 'app', os: currentOs, view: v }, '', '#' + currentOs + '-' + v);
  }
}

function navDetail(key) {
  detailKey = key;
  selected = new Set([key]);
  updateChipsState();
  renderView();
}

          <div class="glass gpu-card ed-card">
            <div class="ed-name" style="color: var(--c-${k});">${d.name}</div>
            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px; font-weight: 600;">${d.cn}</div>
            <div style="display: flex; gap: 8px; background: var(--switch-bg); border-radius: 10px; padding: 10px; border: 1px solid var(--glass-border); margin-bottom: 12px;">
              ${d.stats.map(s => `<div style="flex: 1; text-align: center;"><div style="font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">${s.label}</div><div style="font-size: 11px; font-weight: 800; color: var(--text-main); margin-top: 2px;">${s.value}</div></div>`).join('')}
            </div>
            ${sectionsHtml}${d.notIncluded.length ? `<div style="margin-top: 14px; padding: 10px 12px; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.15); border-radius: 10px; font-size: 11.5px; color: var(--diff-red); line-height: 1.4; font-weight: 600;"><strong style="font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 2px;">${cDict.notInc}</strong>${d.notIncluded.slice(0,4).join(' · ')}${d.notIncluded.length>4?'...':''}</div>` : ''}
          </div>`;
        }).join('')}
      </div>`;
  }
  else if (currentView === 'table') {
    const sel = activeData.order.filter(k => selected.has(k));
    const selIdx = sel.map(k => activeData.order.indexOf(k));
    const headers = sel.map(k => `<th style="color: var(--c-${k});">${activeData.labels[k]}</th>`).join('');

    let lastCat = '';
    const rows = activeData.features.map(f => {
      let catRow = '';
      if (f.cat !== lastCat) { lastCat = f.cat; catRow = `<tr class="row-cat"><td colspan="${sel.length+1}">${f.cat}</td></tr>`; }
      const cells = selIdx.map((idx, i) => {
        const val = f.v[idx];
        if (typeof val === 'string') return `<td>${val}</td>`;
        if (val === 1) return `<td><span class="ic-y">✓</span></td>`;
        return `<td><span class="ic-n">✗</span></td>`;
      }).join('');
      return catRow + `<tr><td>${f.name}</td>${cells}</tr>`;
    }).join('');
    
    const infoRows = `<tr style="border-top: 1px solid rgba(0,0,0,0.04);"><td colspan="${sel.length+1}" class="row-cat" style="border-bottom:none;">${cDict.authInfo}</td></tr>
      <tr><td>${cDict.authType}</td>${sel.map(k => `<td>${activeData.editions[k].info[0].value}</td>`).join('')}</tr>
      <tr><td>${cDict.targetAudience}</td>${sel.map(k => `<td>${activeData.editions[k].info[1].value}</td>`).join('')}</tr>
      <tr><td style="border-bottom-left-radius: 20px;">${cDict.channel}</td>${sel.map((k, i) => `<td style="${i===sel.length-1?'border-bottom-right-radius: 20px;':''}">${activeData.editions[k].info[2].value}</td>`).join('')}</tr>`;

    container.innerHTML = `
      <div class="glass view-fade table-wrap">
        <table>
          <thead><tr><th class="th-first">${cDict.tableHeader}</th>${headers}</tr></thead>
          <tbody>${rows}${infoRows}</tbody>
        </table>
      </div>`;
  }
  else if (currentView === 'version') {
    const rows = activeData.versions.map((v, i) => {
      const isLast = i === activeData.versions.length - 1;
      const feats = v.features.map(f => `<div style="font-size: 13.5px; font-weight: 500; color: var(--text-muted); padding: 5px 0 5px 16px; position: relative;"><span style="position: absolute; left: 0; top: 12px; width: 5px; height: 5px; border-radius: 50%; background: var(--text-faint);"></span>${f}</div>`).join('');
      return `
        <div class="timeline-item">
          <div class="timeline-line"></div>
          <div class="timeline-dot" style="border-color:${v.color};"></div>
          <div class="timeline-content">
            <div class="gpu-card glass ver-card" style="padding: 32px; border-radius: 20px; text-align: left;">
              <div class="ver-tl-inline">
                <div class="ver-tl-label" style="color: ${v.color};">${v.label}</div>
                <div class="ver-tl-date">${v.release}</div>
              </div>
              <div class="ver-name">${v.name}</div>
              <span class="ver-badge">${v.statusText}</span>
              
              <div style="font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; color: var(--text-main); letter-spacing: 1px;">${cDict.timelineCore}</div>
              ${feats}
              
              <div class="ver-note"><strong style="color: var(--text-main); font-weight: 800; margin-right: 8px;">${cDict.note}</strong>${v.note}</div>
            </div>
          </div>
        </div>`;
    }).join('');
    container.innerHTML = `<div class="view-fade timeline-container">${renderSources()}${rows}</div>`;
  }
  else if (currentView === 'wizard') {
    const qList = quiz[lang];
    if (wizardStep >= qList.length) {
      const sorted = Object.entries(wizardScores).sort((a, b) => b[1] - a[1]);
      const topKey = sorted[0][0];
      const d = activeData.editions[topKey];
      container.innerHTML = `
        <div class="wizard-view">
          <div class="glass view-fade wizard-card">
            <div class="wiz-result-name" style="color: var(--c-${topKey});">${d.name}</div>
            <div style="font-size: 16px; color: var(--text-muted); font-weight: 600; margin-bottom: 32px;">${d.cn} — ${d.sub}</div>
            <div style="font-size: 15px; color: var(--text-muted); line-height: 1.8; text-align: left; background: var(--switch-bg); padding: 32px; border-radius: 20px; border: 1px solid var(--glass-border); margin-bottom: 40px;">
              <strong style="color: var(--text-main); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; font-weight: 800;">${cDict.targetAudience}</strong><br>${d.goodFor}<br><br>
              <strong style="color: var(--text-main); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; font-weight: 800;">${cDict.authType}</strong><br>${d.info[0].value}
            </div>
            <button class="gpu-card" style="padding: 16px 40px; background: var(--text-main); color: var(--bg-base); border: none; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer; display:inline-block;" onclick="wizardRestart()">${cDict.wizRestart}</button>
          </div>
        </div>`;
      return;
    }
    const q = qList[wizardStep];
    const progress = (wizardStep / qList.length) * 100;
    const opts = q.opts.map((o, i) => `
      <button class="gpu-card wiz-opt" onclick="wizardAnswer(${i})">
        <span style="width: 32px; height: 32px; border-radius: 50%; background: var(--bg-base); display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--text-muted); flex-shrink: 0; font-weight: 800; border: 1px solid var(--glass-border);">${i + 1}</span>${o.label}
      </button>`).join('');
    container.innerHTML = `
      <div class="wizard-view">
        <div class="view-fade wizard-card" style="background:transparent; border:none; box-shadow:none;">
          <div class="wiz-progress"><div class="wiz-progress-bar" style="width:${progress}%;"></div></div>
          <div style="font-size: 13px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px;">${cDict.wizQHeader} ${wizardStep + 1} / ${qList.length}</div>
          <div class="wiz-q">${q.q}</div>
          <div class="wiz-opts">${opts}</div>
          ${wizardStep > 0 ? `<button class="wiz-back" onclick="wizardBack()">${cDict.wizBack}</button>` : ''}
        </div>
      </div>`;
  }
}

function wizardAnswer(idx) {
  const qList = quiz[lang];
  if (wizardAnswers[wizardStep] !== undefined) {
    const prev = qList[wizardStep].opts[wizardAnswers[wizardStep]].s;
    for (let pk in prev) wizardScores[pk] = (wizardScores[pk] || 0) - prev[pk];
  }
  const scores = qList[wizardStep].opts[idx].s;
  for (let sk in scores) wizardScores[sk] = (wizardScores[sk] || 0) + scores[sk];
  wizardAnswers[wizardStep] = idx;
  wizardStep++;
  renderView();
}
function wizardBack() { if (wizardStep > 0) { wizardStep--; renderView(); } }
function wizardRestart() { wizardStep = 0; wizardScores = {}; wizardAnswers = []; renderView(); }
</script>
</body>
</html>

  ■ 文件结构（行号区间为近似值，加注释后会偏移）
    1.  <head>                  页面元信息 + favicon
    2.  <style> ... </style>     全部 CSS（约 L8 – L626）
        ├─ :root                CSS 变量（颜色 / 字号 / 间距）
        ├─ body / .app           全局背景（mesh 渐变 + 网格）+ 主容器
        ├─ .landing              起始页（全屏覆盖层）
        ├─ .topbar               顶栏：标题 + 视图切换按钮
        ├─ .selector             版本选择器（chip 按钮行）
        ├─ .content              主内容区（各视图挂载点）
        ├─ .detail-view          详情视图（单版本概览档案）
        ├─ .card-wrap            卡片视图（卡片在上 + diff 面板在下）
        ├─ .diff-panel           差异分析面板（多列 N 维对比）
        ├─ .table-wrap           对比表视图（横向 sticky 首列 + 纵向 sticky 表头）
        ├─ .version-view         版本时间线视图
        ├─ .wizard-card          推荐向导
        └─ @media 768px / 380px  移动端适配
    3.  <body> ... </body>       HTML 结构（约 L628 – L700）
        ├─ #landing              起始页 DOM
        ├─ .topbar               顶栏 DOM
        ├─ .selector             选择器 DOM
        └─ #content              各视图容器（render() 挂载点）
    4.  <script> ... </script>   全部 JS（约 L702 – L1605）
        ├─ const editions        8 个版本的完整数据（约 L703 – L1010）
        ├─ const order/labels    显示顺序与短标签
        ├─ 状态变量              selected / detailKey / view
        ├─ onChip()              chip 点击：切换选中 / 详情切换
        ├─ updateChips()         刷新 chip 选中态与计数
        ├─ switchView(v)         切换视图（detail/cards/table/version/wizard）
        ├─ render()              主渲染分发器
        ├─ renderDetail()        详情视图渲染
        ├─ renderCards()         卡片视图 + diff 面板渲染
        ├─ renderTable()         对比表渲染
        ├─ renderVersion()       时间线渲染
        ├─ navDetail()           详情视图左右导航
        ├─ renderWizard()        推荐向导渲染
        ├─ wizardAnswer/Back/    向导交互
        ├─ enterApp()            从起始页进入应用
        └─ 键盘事件 + 初始化

  ■ 修改指南
    · 改版本数据     → 搜 `const editions`，每个版本对象字段说明见 L703 注释
    · 改配色         → 搜 `:root`，每个版本有 --xxx（深）/ --xxx-l（浅）两色
    · 改某个视图样式 → 搜 `── XXX View ──` 定位区块
    · 改移动端适配   → 搜 `@media`
    · 改键盘快捷键   → 搜 `keydown` 事件
    · ⚠️ 标记的注释  是踩过坑的关键修复点，改动前请仔细阅读

  ■ 已知踩坑记录（详见带 ⚠️ 的行内注释）
    1. renderCards 用 appendChild 累积节点 → 进入时必须 replaceChildren()
    2. 卡片视图左右双列布局导致 diff 面板"头重脚轻" → 改单列流式
    3. 对比表 thead th:first-child 没加 sticky:left → 水平滚动时表头错位
    4. 移动端表格 padding 过大 → 行间空缺，已缩到 5px 8px
  ════════════════════════════════════════════════════════════════════════

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* ─────────────────────────────────────────────
     :root  全局 CSS 变量
     ─────────────────────────────────────────────
     · --bg / --card-bg / --card-bg2  三层背景色（最深→最浅）
     · --text / --text-dim / --text-faint  三级文字色
     · --border / --border-hover  边框色（默认 / 悬停）
     · --xxx / --xxx-l  每个版本一对色（深色用于 accent/标签底，
                        浅色 -l 用于文字/小图标，确保暗背景下可读）
     · 修改版本配色：同时改 --xxx 和 --xxx-l 两个变量
     ───────────────────────────────────────────── */
  :root {
    --bg: #0f0f17;
    --card-bg: #1a1a2e;
    --card-bg2: #16162a;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --text: #d0d0d0;
    --text-dim: #777;
    --text-faint: #555;
    --home: #378ADD;
    --home-l: #85B7EB;
    --pro: #7F77DD;
    --pro-l: #AFA9EC;
    --ws: #BA7517;
    --ws-l: #FAC775;
    --ent: #1D9E75;
    --ent-l: #5DCAA5;
    --edu: #17A2B8;
    --edu-l: #5DDEEF;
    --pedu: #9B6DD9;
    --pedu-l: #C4A5F0;
    --ltsc: #6B8E4E;
    --ltsc-l: #A8C988;
    --iot: #D4633A;
    --iot-l: #F09870;
  }
  /* ─────────────────────────────────────────────
     body / .app  全局背景与主容器
     ─────────────────────────────────────────────
     · body::before  mesh 渐变光斑（缓慢漂移动画，营造氛围）
     · body::after   44px 网格底纹（极淡，增加质感）
     · .app          居中限宽 1600px 的纵向 flex 容器
     · overflow:hidden 在 body 上，滚动交给各视图自己处理
     ───────────────────────────────────────────── */
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 20% 15%, rgba(55,138,221,0.06), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(127,119,221,0.05), transparent 40%),
      radial-gradient(circle at 60% 50%, rgba(29,158,117,0.03), transparent 45%);
    animation: meshMove 22s ease-in-out infinite;
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .app {
    display: flex; flex-direction: column;
    height: 100vh; max-width: 1600px; margin: 0 auto;
    position: relative; z-index: 1;
  }

  /* ─────────────────────────────────────────────
     .landing  起始页（全屏覆盖层 z-index:9999）
     ─────────────────────────────────────────────
     · 进入应用前显示，含 Windows logo + 标题 + 8 版本色点
     · enterApp() 触发淡出动画后 display:none
     · .ld-glow  背后径向光晕
     ───────────────────────────────────────────── */
  /* ── Landing ── */
  .landing {
    position: fixed; inset: 0; z-index: 9999; background: var(--bg);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .landing.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
  .landing::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 25% 35%, rgba(55,138,221,0.10), transparent 45%),
      radial-gradient(circle at 75% 65%, rgba(127,119,221,0.10), transparent 45%),
      radial-gradient(circle at 50% 80%, rgba(29,158,117,0.05), transparent 50%);
    animation: meshMove 18s ease-in-out infinite;
  }
  .landing::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 44px 44px; pointer-events: none;
  }
  @keyframes meshMove { 0%,100%{transform:scale(1) translate(0,0);} 33%{transform:scale(1.08) translate(2%,-1%);} 66%{transform:scale(1.05) translate(-1%,2%);} }
  .ld-center { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .ld-glow { position: absolute; width: 160px; height: 160px; top: -44px; background: radial-gradient(circle, rgba(55,138,221,0.18), transparent 65%); border-radius: 50%; animation: glowPulse 4s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100%{opacity:0.4;transform:scale(1);} 50%{opacity:0.7;transform:scale(1.15);} }
  .win-logo {
    display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
    width: 72px; height: 72px; margin-bottom: 28px;
    transform: perspective(500px) rotateY(-12deg); position: relative;
  }
  .win-tile {
    background: linear-gradient(135deg, #2B88D8, #50A0E8); border-radius: 2px;
    box-shadow: 0 0 16px rgba(43,136,216,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
    opacity: 0; animation: tileIn 0.5s ease-out forwards;
  }
  .win-tile:nth-child(1){animation-delay:0.2s;} .win-tile:nth-child(2){animation-delay:0.35s;}
  .win-tile:nth-child(3){animation-delay:0.5s;} .win-tile:nth-child(4){animation-delay:0.65s;}
  @keyframes tileIn { from{opacity:0;transform:scale(0.4);} to{opacity:1;transform:scale(1);} }
  .ld-title {
    font-size: 44px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(135deg, #378ADD 0%, #7F77DD 50%, #1D9E75 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    opacity: 0; animation: fadeUp 0.8s ease-out 0.8s forwards;
  }
  .ld-sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; letter-spacing: 2px; opacity: 0; animation: fadeUp 0.8s ease-out 1s forwards; }
  .ld-dots { display: flex; gap: 7px; margin-top: 18px; opacity: 0; animation: fadeUp 0.8s ease-out 1.1s forwards; }
  .ld-dot { width: 7px; height: 7px; border-radius: 50%; }
  .ld-stats { display: flex; gap: 32px; margin-top: 22px; opacity: 0; animation: fadeUp 0.8s ease-out 1.2s forwards; }
  .ld-stat { text-align: center; }
  .ld-stat-num { font-size: 26px; font-weight: 700; color: #e0e0e0; }
  .ld-stat-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }
  .ld-divider { width: 1px; height: 32px; background: rgba(255,255,255,0.06); align-self: center; }
  .enter-btn {
    margin-top: 30px; padding: 11px 38px;
    background: linear-gradient(135deg, rgba(55,138,221,0.12), rgba(127,119,221,0.12));
    border: 1px solid rgba(127,119,221,0.25); border-radius: 8px;
    color: #b8b8d8; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
    letter-spacing: 2px; transition: all 0.3s ease; position: relative; overflow: hidden;
    opacity: 0; animation: fadeUp 0.8s ease-out 1.4s forwards, btnPulse 2.5s ease-in-out 2.2s infinite;
  }
  .enter-btn:hover {
    background: linear-gradient(135deg, rgba(55,138,221,0.22), rgba(127,119,221,0.22));
    border-color: rgba(127,119,221,0.45); box-shadow: 0 0 28px rgba(127,119,221,0.18);
    transform: translateY(-2px); color: #d0d0f0;
  }
  .enter-btn::after {
    content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); transition: left 0.5s ease;
  }
  .enter-btn:hover::after { left: 100%; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
  @keyframes btnPulse { 0%,100%{box-shadow:0 0 0 0 rgba(127,119,221,0.12);} 50%{box-shadow:0 0 18px 3px rgba(127,119,221,0.08);} }
  .ld-footer { position: absolute; bottom: 24px; font-size: 10px; color: var(--text-faint); letter-spacing: 1px; opacity: 0; animation: fadeUp 0.8s ease-out 1.6s forwards; }
  .particle { position: absolute; border-radius: 50%; opacity: 0.25; pointer-events: none; animation: floatUp linear infinite; }
  @keyframes floatUp { from{transform:translateY(100vh);} to{transform:translateY(-10vh);} }

  /* ─────────────────────────────────────────────
     .topbar  顶栏：标题 + 视图切换按钮组
     ─────────────────────────────────────────────
     · 5 个按钮：详情 / 卡片 / 对比表 / 时间线 / 向导
     · .topbar-meta  右侧元信息（移动端隐藏）
     · 按钮点击 → switchView()
     ───────────────────────────────────────────── */
  /* ── Topbar ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 28px 8px; flex-shrink: 0;
  }
  .topbar-title { font-size: 17px; font-weight: 600; color: #e8e8e8; letter-spacing: 0.3px; }
  .topbar-meta { font-size: 11px; color: var(--text-faint); margin-left: 8px; font-weight: 400; }
  .view-switch { display: flex; gap: 2px; background: rgba(255,255,255,0.04); border-radius: 8px; padding: 2px; }
  .view-switch button {
    background: none; border: none; color: var(--text-dim); font-size: 12px;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-family: inherit;
  }
  .view-switch button.active { background: rgba(255,255,255,0.08); color: #e8e8e8; }

  /* ─────────────────────────────────────────────
     .selector  版本选择器（chip 按钮行）
     ─────────────────────────────────────────────
     · 8 个 chip，点击 → onChip(key)
     · .chip.active  当前选中（边框高亮 + accent 条）
     · .hint  右侧提示文字（移动端隐藏）
     · 移动端：横向滚动 + sticky 在顶栏下方
     ───────────────────────────────────────────── */
  /* ── Selector ── */
  .selector {
    display: flex; gap: 7px; padding: 0 28px 10px; flex-wrap: wrap; flex-shrink: 0; align-items: center;
  }
  .chip {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 13px; border-radius: 18px; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.25s ease; border: 1px solid; font-family: inherit; user-select: none;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip.active { opacity: 1; }
  .chip.inactive { opacity: 0.3; }
  .chip.home { border-color: var(--home); color: var(--home-l); } .chip.home.active { background: rgba(55,138,221,0.1); } .chip.home .dot { background: var(--home); }
  .chip.pro  { border-color: var(--pro);  color: var(--pro-l);  } .chip.pro.active  { background: rgba(127,119,221,0.1);} .chip.pro .dot  { background: var(--pro); }
  .chip.ws   { border-color: var(--ws);   color: var(--ws-l);   } .chip.ws.active   { background: rgba(186,117,23,0.1);} .chip.ws .dot   { background: var(--ws); }
  .chip.ent  { border-color: var(--ent);  color: var(--ent-l);  } .chip.ent.active  { background: rgba(29,158,117,0.1);} .chip.ent .dot  { background: var(--ent); }
  .chip.edu  { border-color: var(--edu);  color: var(--edu-l);  } .chip.edu.active  { background: rgba(23,162,184,0.1);} .chip.edu .dot  { background: var(--edu); }
  .chip.pedu { border-color: var(--pedu); color: var(--pedu-l);} .chip.pedu.active { background: rgba(155,109,217,0.1);}.chip.pedu .dot { background: var(--pedu); }
  .chip.ltsc { border-color: var(--ltsc); color: var(--ltsc-l);} .chip.ltsc.active { background: rgba(107,142,78,0.1);} .chip.ltsc .dot { background: var(--ltsc); }
  .chip.iot  { border-color: var(--iot);  color: var(--iot-l);  } .chip.iot.active  { background: rgba(212,99,58,0.1);} .chip.iot .dot  { background: var(--iot); }
  .hint { font-size: 11px; color: var(--text-faint); margin-left: auto; }

  /* ─────────────────────────────────────────────
     .content  主内容区（flex:1 撑满剩余高度）
     ─────────────────────────────────────────────
     · 各视图容器（#detail-view / #card-view / #table-view /
       #version-view / #wizard-view）通过 display:none 切换
     · render() 根据 view 状态决定显示哪个
     ───────────────────────────────────────────── */
  /* ── Content ── */
  .content { flex: 1; overflow: hidden; padding: 0 28px 20px; display: flex; }

  /* ─────────────────────────────────────────────
     .detail-view  详情视图（单版本"概览档案"）
     ─────────────────────────────────────────────
     · 定位：精简概览，与卡片视图的"完整对比"区分开
     · 内容：版本名 + 横排规格条 + 核心亮点 + 不包含（单行）
              + 适合/不适合（内联）+ 授权信息 + 备注
     · 不含：完整功能列表、6 宫格 stats（这些在卡片视图里）
     · .detail-nav  顶部左右箭头切换版本（navDetail()）
     ───────────────────────────────────────────── */
  /* ── Detail View (概览档案) ── */
  .detail-view {
    width: 100%; height: 100%; overflow-y: auto; padding-right: 6px;
  }
  .detail-view::-webkit-scrollbar { width: 4px; }
  .detail-view::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
  .detail-card {
    background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border);
    overflow: hidden; max-width: 720px; margin: 0 auto;
  }
  .detail-accent { height: 5px; width: 100%; border-radius: 11px 11px 0 0; }
  .detail-hero { padding: 20px 32px 4px; }
  .detail-body { padding: 16px 32px 28px; }
  .detail-name { font-size: 24px; font-weight: 700; margin-bottom: 3px; }
  .detail-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }
  .detail-specs {
    display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card-bg2);
  }
  .detail-spec { flex: 1; padding: 10px 12px; text-align: center; border-right: 1px solid var(--border); }
  .detail-spec:last-child { border-right: none; }
  .detail-spec-v { font-size: 16px; font-weight: 700; color: #e0e0e0; }
  .detail-spec-l { font-size: 9.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }

  }

  }

  /* color binds for detail */
  .dc-home .detail-accent { background: var(--home); } .dc-home .detail-name { color: var(--home-l); } .dc-home .detail-section-title { color: var(--home); } .dc-home .detail-feat::before { background: var(--home); }
  .dc-pro .detail-accent { background: var(--pro); } .dc-pro .detail-name { color: var(--pro-l); } .dc-pro .detail-section-title { color: var(--pro); } .dc-pro .detail-feat::before { background: var(--pro); }
  .dc-ws .detail-accent { background: var(--ws); } .dc-ws .detail-name { color: var(--ws-l); } .dc-ws .detail-section-title { color: var(--ws); } .dc-ws .detail-feat::before { background: var(--ws); }
  .dc-ent .detail-accent { background: var(--ent); } .dc-ent .detail-name { color: var(--ent-l); } .dc-ent .detail-section-title { color: var(--ent); } .dc-ent .detail-feat::before { background: var(--ent); }
  .dc-edu .detail-accent { background: var(--edu); } .dc-edu .detail-name { color: var(--edu-l); } .dc-edu .detail-section-title { color: var(--edu); } .dc-edu .detail-feat::before { background: var(--edu); }
  .dc-pedu .detail-accent { background: var(--pedu); } .dc-pedu .detail-name { color: var(--pedu-l); } .dc-pedu .detail-section-title { color: var(--pedu); } .dc-pedu .detail-feat::before { background: var(--pedu); }
  .dc-ltsc .detail-accent { background: var(--ltsc); } .dc-ltsc .detail-name { color: var(--ltsc-l); } .dc-ltsc .detail-section-title { color: var(--ltsc); } .dc-ltsc .detail-feat::before { background: var(--ltsc); }
  .dc-iot .detail-accent { background: var(--iot); } .dc-iot .detail-name { color: var(--iot-l); } .dc-iot .detail-section-title { color: var(--iot); } .dc-iot .detail-feat::before { background: var(--iot); }

  /* ─────────────────────────────────────────────
     .card-wrap  卡片视图（单列流式布局）
     ─────────────────────────────────────────────
     · 结构：[.card-grid 卡片网格] + [.diff-panel 差异分析]
     · 单列纵向堆叠，整个 .card-wrap 一个滚动容器
     · .card-grid  根据选中数量自适应 1-4 列
     · ⚠️ 之前用左右双列（1fr + 280px）导致 diff 面板
            "头重脚轻"被强制拉伸，已改为单列流式
     ───────────────────────────────────────────── */
  /* ── Card View (单列流式: 卡片在上, diff 在下) ── */
  .card-wrap {
    width: 100%; height: 100%; min-height: 0;
    display: flex; flex-direction: column; gap: 14px;
    overflow-y: auto; overflow-x: hidden; padding-right: 4px;
  }
  .card-wrap::-webkit-scrollbar { width: 6px; }
  .card-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  .card-wrap::-webkit-scrollbar-track { background: transparent; }
  .card-grid { display: grid; gap: 14px; width: 100%; flex-shrink: 0; }
  .card-grid.cols-1 { grid-template-columns: minmax(0, 720px); justify-content: center; }
  .card-grid.cols-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .card-grid.cols-3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
  .card-grid.cols-4 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
  .ed-card {
    background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; transition: border-color 0.2s;
    min-width: 0;
  }
  .ed-card:hover { border-color: var(--border-hover); }
  .ed-card .accent { height: 5px; border-radius: 11px 11px 0 0; }
  .ed-card.home .accent { background: var(--home); } .ed-card.pro .accent { background: var(--pro); }
  .ed-card.ws .accent { background: var(--ws); } .ed-card.ent .accent { background: var(--ent); }
  .ed-card.edu .accent { background: var(--edu); } .ed-card.pedu .accent { background: var(--pedu); }
  .ed-card.ltsc .accent { background: var(--ltsc); } .ed-card.iot .accent { background: var(--iot); }
  .ed-card-body {
    padding: 12px 14px; display: flex; flex-direction: column; flex: 1; min-height: 0;
  }
  .ed-name { font-size: 14.5px; font-weight: 700; margin-bottom: 2px; }
  .ed-card.home .ed-name { color: var(--home-l); } .ed-card.pro .ed-name { color: var(--pro-l); }
  .ed-card.ws .ed-name { color: var(--ws-l); } .ed-card.ent .ed-name { color: var(--ent-l); }
  .ed-card.edu .ed-name { color: var(--edu-l); } .ed-card.pedu .ed-name { color: var(--pedu-l); }
  .ed-card.ltsc .ed-name { color: var(--ltsc-l); } .ed-card.iot .ed-name { color: var(--iot-l); }
  .ed-sub { font-size: 10.5px; color: var(--text-dim); margin-bottom: 8px; }

  /* 顶部 stats + info 6 宫格 */
  .ed-mini-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    background: var(--card-bg2); border-radius: 8px; padding: 6px;
    border: 1px solid var(--border); margin-bottom: 8px;
  }
  .ed-mini { padding: 4px 6px; }
  .ed-mini-l { font-size: 9px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.3px; }
  .ed-mini-v { font-size: 11px; font-weight: 600; color: #ccc; margin-top: 1px; line-height: 1.3; }

  /* sections 两列布局 */
  .ed-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }
  .ed-section { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; margin-top: 6px; }
  .ed-section:first-child { margin-top: 0; }
  .ed-card.home .ed-section { color: var(--home); } .ed-card.pro .ed-section { color: var(--pro); }
  .ed-card.ws .ed-section { color: var(--ws); } .ed-card.ent .ed-section { color: var(--ent); }
  .ed-card.edu .ed-section { color: var(--edu); } .ed-card.pedu .ed-section { color: var(--pedu); }
  .ed-card.ltsc .ed-section { color: var(--ltsc); } .ed-card.iot .ed-section { color: var(--iot); }
  .ed-feat { font-size: 11px; padding: 2px 0 2px 10px; position: relative; color: #b0b0b0; line-height: 1.45; }
  .ed-feat::before { content: ""; position: absolute; left: 0; top: 8px; width: 4px; height: 4px; border-radius: 50%; opacity: 0.65; }
  .ed-card.home .ed-feat::before { background: var(--home); } .ed-card.pro .ed-feat::before { background: var(--pro); }
  .ed-card.ws .ed-feat::before { background: var(--ws); } .ed-card.ent .ed-feat::before { background: var(--ent); }
  .ed-card.edu .ed-feat::before { background: var(--edu); } .ed-card.pedu .ed-feat::before { background: var(--pedu); }
  .ed-card.ltsc .ed-feat::before { background: var(--ltsc); } .ed-card.iot .ed-feat::before { background: var(--iot); }

  /* notInc 紧凑样式 */
  .ed-not {
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
    font-size: 10.5px; line-height: 1.5; color: var(--text-faint);
  }
  .ed-not strong { color: #888; font-weight: 500; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.3px; display: block; margin-bottom: 3px; }

  /* 底部 goodFor / badFor 横排 (已废弃, 卡片改为只展示核心信息) */
  .ed-foot-box .ed-foot-l { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 3px; }
  .ed-foot-l.good { color: var(--ent-l); }
  .ed-foot-l.bad { color: #888; }
  .ed-foot-t { font-size: 10.5px; color: #aaa; line-height: 1.5; }

  /* ─────────────────────────────────────────────
     .diff-panel  差异分析面板（N 维版本对比）
     ─────────────────────────────────────────────
     · 仅当 selected.size >= 2 时渲染
     · .diff-cols  auto-fit 多列网格，每列一个版本独占
     · 内容：顶部概览（谁多谁少）→ 全部共有 → 各版本独占
     · 颜色：通过 --diff-color CSS 变量跟随版本色系
     · 2 版本自动降级为 A独有 / B独有 / 共有 三段
     ───────────────────────────────────────────── */
  /* ── Diff Panel (统一对比区, 多列内部布局) ── */
  .diff-panel {
    background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border);
    padding: 16px 20px; flex-shrink: 0;
  }
  .diff-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .diff-title::before { content: "⇄"; color: var(--pro-l); font-size: 14px; }
  .diff-title .n { font-size: 9px; color: var(--text-faint); font-weight: 500; padding: 1px 6px; background: rgba(255,255,255,0.04); border-radius: 3px; }
  .diff-summary { font-size: 11px; color: #999; padding: 8px 12px; background: var(--card-bg2); border-radius: 6px; border: 1px solid var(--border); margin-bottom: 12px; line-height: 1.6; }
  .diff-summary strong { color: #ccc; font-weight: 600; }
  .diff-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .diff-col { min-width: 0; }
  .diff-col-h {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px;
    margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
    color: var(--diff-color, #999);
    padding-bottom: 5px; border-bottom: 1px solid var(--border);
  }
  .diff-col-h .cnt { font-size: 9px; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,0.06); color: var(--text-dim); font-weight: 500; }
  .diff-list { font-size: 10.5px; color: #aaa; line-height: 1.6; }
  .diff-list .item { padding: 2px 0 2px 11px; position: relative; }
  .diff-list .item::before { content: ""; position: absolute; left: 0; top: 9px; width: 4px; height: 4px; border-radius: 50%; opacity: 0.7; background: var(--diff-color, #666); }
  .diff-list .more { color: var(--text-faint); font-size: 10px; padding-left: 11px; font-style: italic; margin-top: 2px; }
  .diff-empty { font-size: 10.5px; color: var(--text-faint); padding-left: 11px; font-style: italic; }

  /* ─────────────────────────────────────────────
     .table-wrap  对比表视图
     ─────────────────────────────────────────────
     · 横向 sticky 首列 + 纵向 sticky 表头（双向滚动）
     · .row-cat  分类行（深色背景，如"基础功能""安全加密"）
     · .ic-y / .ic-n  ✓ ✗ 图标（绿/灰）
     · 表格 min-width 防止列被压成单字符
     ───────────────────────────────────────────── */
  /* ── Table View ── */
  .table-wrap {
    width: 100%; height: 100%; overflow: auto; border-radius: 12px; border: 1px solid var(--border); background: var(--card-bg);
  }
  .table-wrap::-webkit-scrollbar { width: 6px; height: 6px; } .table-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead { position: sticky; top: 0; z-index: 1; }
  th { padding: 12px 14px; text-align: center; font-weight: 600; font-size: 12.5px; background: #141428; border-bottom: 1px solid rgba(255,255,255,0.08); }
  th:first-child { text-align: left; color: var(--text-dim); font-weight: 500; width: 180px; min-width: 180px; }
  th.home-h { color: var(--home-l); } th.pro-h { color: var(--pro-l); } th.ws-h { color: var(--ws-l); }
  th.ent-h { color: var(--ent-l); } th.edu-h { color: var(--edu-l); } th.pedu-h { color: var(--pedu-l); }
  th.ltsc-h { color: var(--ltsc-l); } th.iot-h { color: var(--iot-l); }
  td { padding: 7px 14px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.03); }
  td:first-child { text-align: left; color: #aaa; font-size: 12px; }
  .ic-y { color: #5DCAA5; } .ic-n { color: var(--text-faint); }
  .ic-ent { color: var(--ent-l); font-weight: 600; } .ic-ws { color: var(--ws-l); font-weight: 600; }
  .ic-edu { color: var(--edu-l); font-weight: 600; } .ic-iot { color: var(--iot-l); font-weight: 600; }
  .ic-ltsc { color: var(--ltsc-l); font-weight: 600; }
  .row-cat td { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint); padding-top: 10px; padding-bottom: 4px; background: rgba(255,255,255,0.015); }
  .row-info td { color: var(--text-dim); font-size: 11.5px; }
  .row-sep td { border-top: 1px solid rgba(255,255,255,0.08); }

  /* ─────────────────────────────────────────────
     .version-view  版本时间线（5 代功能更新）
     ─────────────────────────────────────────────
     · 21H2 → 22H2 → 23H2 → 24H2 → 25H2
     · 纵向时间轴 + 每代主要功能列表
     ───────────────────────────────────────────── */
  /* ── Version Timeline ── */
  .version-view {
    width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; padding-right: 6px;
  }
  .version-view::-webkit-scrollbar { width: 4px; }
  .version-view::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
  .version-view { width: 100%; height: 100%; padding: 0 4px 10px; }
  .version-track {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;
    min-width: 0;
  }
  .tl-row { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .tl-marker { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .tl-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid; flex-shrink: 0; background: var(--bg); }
  .tl-line { display: none; }
  .ver-card {
    background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; min-width: 0;
    flex: 1; position: relative;
    transition: border-color 0.2s;
  }
  .ver-card:hover { border-color: var(--border-hover); }
  .ver-accent { display: none; }
  .ver-body { padding: 12px 12px 14px; display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .ver-tl-inline { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
  .ver-tl-inline .ver-tl-label { font-size: 12px; font-weight: 600; }
  .ver-tl-inline .ver-tl-date { font-size: 10px; color: var(--text-faint); }
  .ver-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; gap: 6px; }
  .ver-name { font-size: 13px; font-weight: 600; }
  .ver-build { font-size: 10.5px; color: var(--text-faint); margin-bottom: 6px; }
  .ver-badge {
    font-size: 9px; padding: 2px 7px; border-radius: 10px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
  }
  .ver-badge.stopped { background: rgba(100,100,100,0.2); color: #777; }
  .ver-badge.stopped-hp { background: rgba(150,100,50,0.15); color: #c8a; }
  .ver-badge.supported { background: rgba(55,138,221,0.15); color: var(--home-l); }
  .ver-badge.current { background: rgba(29,158,117,0.15); color: var(--ent-l); }
  .ver-badge.latest { background: rgba(127,119,221,0.15); color: var(--pro-l); }
  .ver-build { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
  .ver-dates { font-size: 10.5px; color: var(--text-faint); margin-bottom: 10px; line-height: 1.6; }
  .ver-sep { height: 1px; background: var(--border); margin-bottom: 10px; }
  .ver-section { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .ver-feat { font-size: 11px; padding: 2px 0 2px 12px; position: relative; color: #aaa; line-height: 1.5; }
  .ver-feat::before { content: ""; position: absolute; left: 0; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--vc,#666); opacity: 0.7; }
  .ver-note { font-size: 10px; color: var(--text-faint); padding: 8px 10px; background: var(--card-bg2); border-radius: 6px; margin-top: auto; line-height: 1.5; }

  /* ── View Fade ──  视图切换时的淡入动画（view-fade class） */
  .view-fade { animation: vFade 0.3s ease-out; }
  @keyframes vFade { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }

  /* ── Detail Nav ──  详情视图顶部左右导航箭头 + 序号 */
  .detail-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .nav-arrow {
    width:34px; height:34px; border-radius:50%; background:var(--card-bg2);
    border:1px solid var(--border); color:var(--text-dim); font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all 0.2s; font-family:inherit;
  }
  .nav-arrow:hover { background:rgba(255,255,255,0.06); border-color:var(--border-hover); color:#e0e0e0; }
  .nav-pos { font-size:11px; color:var(--text-faint); letter-spacing:1px; }

  /* ─────────────────────────────────────────────
     Table Hover + Sticky First Col  ⚠️ 关键修复区
     ─────────────────────────────────────────────
     · tbody td:first-child   sticky:left:0  z-index:1
       水平滚动时首列固定
     · thead th:first-child   sticky:left:0  z-index:3
       ⚠️ 表头首列也要横向 sticky，否则水平滚动时表头
          "功能 / 特性"会跑掉，与 tbody 首列错位
     · thead th (移动端)      z-index:2  仅纵向 sticky
     · ::after 1px 右分隔线  避免 sticky 列与滚动列间透明间隙
     · .row-cat td:first-child  分类行首列用更深背景 #141428
     ───────────────────────────────────────────── */
  /* ── Table Hover + Sticky First Col ── */
  .table-wrap tr:hover td { background:rgba(255,255,255,0.018); }
  .table-wrap td:first-child { position:sticky; left:0; background:var(--card-bg); z-index:1; }
  .table-wrap tr.row-cat td:first-child { background:#141428; }
  /* thead 第一列也要横向 sticky，否则水平滚动时表头 "功能 / 特性" 会跑掉 */
  .table-wrap thead th:first-child { position:sticky; left:0; z-index:3; background:var(--card-bg); }
  .table-wrap thead th:first-child::after {
    content:""; position:absolute; top:0; right:-1px; bottom:0; width:1px;
    background:rgba(255,255,255,0.08);
  }

  /* ─────────────────────────────────────────────
     .wizard-card  推荐向导
     ─────────────────────────────────────────────
     · 问答式：根据使用场景推荐最合适的版本
     · wizardAnswer() / wizardBack() / wizardRestart()
     · 顶部进度条显示当前问题序号
     ───────────────────────────────────────────── */
  /* ── Wizard ── */
  .wizard-view { width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow-y:auto; }
  .wizard-card {
    background:var(--card-bg); border-radius:16px; border:1px solid var(--border);
    max-width:560px; width:100%; padding:36px 40px; position:relative; overflow:hidden;
  }
  .wizard-card::before {
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg,#378ADD,#7F77DD,#1D9E75);
  }

    .detail-view, #table-view, .version-view, .wizard-view,
    .ed-card, .ed-card-body {
      height: auto !important; max-height: none !important; overflow: visible !important;

/* ── 顺序与标签 ──
   order   chip 排列顺序 + 详情导航顺序
   labels  chip / 表头短标签
   ⚠️ 新增版本必须同时加到 order 和 labels */
const order = ['home','pro','ws','ent','edu','pedu','ltsc','iot'];
const labels = { home:'Home', pro:'Pro', ws:'Workstations', ent:'Enterprise', edu:'Education', pedu:'Pro Edu', ltsc:'LTSC 2024', iot:'IoT' };

/* ── 全局状态 ──
   selected   当前选中的版本集合（卡片/对比表用）
   detailKey  详情视图当前展示的版本
   view       当前视图名 */
let selected = new Set(['home']);
let detailKey = 'home';
let view = 'detail';

/**
 * onChip  chip 按钮点击处理
 * @param {string} key  版本 key（如 'home'）
 *
 * 行为分视图：
 *   detail  → 切换详情版本，selected 重置为单个
 *   cards/table → 切换选中（toggle），最少保留 1 个
 *   version/wizard → 忽略（这两个视图不响应 chip）
 */
function onChip(key) {
  if (view === 'version' || view === 'wizard') return;
  if (view === 'detail') {
    detailKey = key;
    selected = new Set([key]);
    updateChips();
    render();
  } else {
    if (selected.has(key)) {
      if (selected.size <= 1) return;
      selected.delete(key);
    } else {
      selected.add(key);
    }
    updateChips();
    render();
  }
}

/**
 * updateChips  刷新 chip 按钮的选中态与计数文字
 * 遍历所有 .chip，根据 selected / detailKey 切换 .active class
 */
function updateChips() {
  order.forEach(k => {
    const btn = document.querySelector('.chip.' + k);
    if (view === 'detail') {
      if (k === detailKey) { btn.classList.add('active'); btn.classList.remove('inactive'); }
      else { btn.classList.remove('active'); btn.classList.add('inactive'); }
    } else {
      if (selected.has(k)) { btn.classList.add('active'); btn.classList.remove('inactive'); }
      else { btn.classList.remove('active'); btn.classList.add('inactive'); }
    }
  });
  document.getElementById('hint-text').textContent =
    view === 'detail' ? '点击版本查看详情' :
    view === 'cards' ? '选择 1-4 个对比（当前 ' + selected.size + '）' :
    view === 'table' ? '选择 1-8 个对比（当前 ' + selected.size + '）' :
    view === 'wizard' ? '回答问题，获取版本推荐' :
    '查看 5 代功能更新时间线';
}

/**
 * switchView  切换视图
 * @param {string} v  目标视图：'detail'/'cards'/'table'/'version'/'wizard'
 *
 * 状态同步规则：
 *   detail → 其他  selected 重置为单个（detailKey）
 *   其他 → detail  detailKey 取 selected 第一个，selected 重置为单个
 *   ⚠️ 之前切到 cards 会强制塞入第二个版本，已改为保留单个
 *
 * 同时：切换顶栏按钮 active 态、显隐选择器、重渲染
 */
function switchView(v) {
  if (view === 'detail' && v !== 'detail') {
    selected = new Set([detailKey]);
  }
  if (v === 'detail' && view !== 'detail') {
    detailKey = order.find(k => selected.has(k)) || 'home';
    selected = new Set([detailKey]);
  }
  view = v;
  document.getElementById('btn-detail').classList.toggle('active', v === 'detail');
  document.getElementById('btn-cards').classList.toggle('active', v === 'cards');
  document.getElementById('btn-table').classList.toggle('active', v === 'table');
  document.getElementById('btn-version').classList.toggle('active', v === 'version');
  document.getElementById('btn-wizard').classList.toggle('active', v === 'wizard');
  document.querySelector('.selector').style.display = (v === 'version' || v === 'wizard') ? 'none' : 'flex';
  updateChips();
  render();
}

/**
 * render  主渲染分发器
 * 隐藏所有视图容器，显示当前 view 对应的，调用对应 render 函数
 */
function render() {
  document.getElementById('detail-view').style.display = view === 'detail' ? 'block' : 'none';
  document.getElementById('card-view').style.display = view === 'cards' ? 'grid' : 'none';
  document.getElementById('table-view').style.display = view === 'table' ? 'block' : 'none';
  document.getElementById('version-view').style.display = view === 'version' ? 'block' : 'none';
  document.getElementById('wizard-view').style.display = view === 'wizard' ? 'flex' : 'none';
  if (view === 'detail') renderDetail();
  else if (view === 'cards') renderCards();
  else if (view === 'table') renderTable();
  else if (view === 'version') renderVersion();
  else if (view === 'wizard') renderWizard();
}

/**
 * renderDetail  渲染详情视图（单版本概览档案）
 * 数据源：editions[detailKey]
 * 内容：版本名 + 横排规格 + 核心亮点 + 不包含 + 适合/不适合 + 备注
 * 顶部 navDetail() 左右箭头切换版本
 */
function renderDetail() {
  const d = editions[detailKey];
  const k = detailKey;
  const curIdx = order.indexOf(k);
  const prevKey = order[(curIdx - 1 + order.length) % order.length];
  const nextKey = order[(curIdx + 1) % order.length];
  const specs = d.stats.map(s =>
    `<div class="detail-spec"><div class="detail-spec-v">${s.value}</div><div class="detail-spec-l">${s.label}</div></div>`
  ).join('');
  const firstSection = d.sections[0];
  const highlights = firstSection.items.slice(0, 6).map(i =>
    `<div class="detail-feat">${i}</div>`
  ).join('');
  const notInc = d.notIncluded.length
    ? `<div class="detail-notinc"><span class="detail-notinc-l">不含</span>${d.notIncluded.join(' · ')}</div>`
    : '';
  const license = d.info.map(i =>
    `<span class="detail-lic-item"><strong>${i.label}</strong> ${i.value}</span>`
  ).join('');

  document.getElementById('detail-view').innerHTML = `
    <div class="detail-card dc-${k} view-fade">
      <div class="detail-accent"></div>
      <div class="detail-hero">
        <div class="detail-nav">
          <button class="nav-arrow" onclick="navDetail('${prevKey}')">&#8592;</button>
          <span class="nav-pos">${curIdx + 1} / ${order.length}</span>
          <button class="nav-arrow" onclick="navDetail('${nextKey}')">&#8594;</button>
        </div>
        <div class="detail-name">${d.name}</div>
        <div class="detail-sub">${d.cn} — ${d.sub}</div>
        <div class="detail-specs">${specs}</div>
      </div>
      <div class="detail-body">
        <div class="detail-positioning">
          <div class="detail-pos"><span class="detail-pos-l good">&#10003; 适合</span><span class="detail-pos-t">${d.goodFor}</span></div>
          <div class="detail-pos"><span class="detail-pos-l bad">&#10007; 不适合</span><span class="detail-pos-t">${d.badFor}</span></div>
        </div>
        <div class="detail-section">
          <div class="detail-section-title">${firstSection.label}</div>
          ${highlights}
        </div>
        ${notInc}
        <div class="detail-license">${license}</div>
        <div class="detail-note">${d.note}</div>
      </div>
    </div>`;
}

/**
 * renderCards  渲染卡片视图（卡片网格 + 差异分析面板）
 *
 * 结构：
 *   .card-wrap (flex column, 单一滚动容器)
 *     ├─ .card-grid   N 个版本卡片（1-4 列自适应）
 *     └─ .diff-panel  差异分析（仅 selected.size >= 2 时）
 *
 * ⚠️ 关键修复：
 *   1. 进入时必须 wrap.replaceChildren() 清空旧节点
 *      之前用 appendChild 累积，切走再切回会重复渲染（2 个 Home）
 *   2. diff 面板支持 N 维对比（非仅 2 版本）：
 *      - 全部共有（交集）
 *      - 各版本独占（仅 1 个版本有）
 *      - 顶部概览（谁多谁少）
 *
 * 卡片内容：name/sub/6宫格stats/sections/不包含
 *   （已移除冗余的"适合/不适合"和"tags"，这些在详情视图里）
 */
function renderCards() {
  const sel = order.filter(k => selected.has(k));
  const wrap = document.getElementById('card-view');
  wrap.className = 'card-wrap view-fade';
  wrap.replaceChildren(); // 关键修复：清空旧节点, 避免切回卡片时重复渲染
  wrap.style.cssText = '';

  // 上方：N 个紧凑版本卡（去掉"适合/不适合"和"tags"等冗余信息）
  const grid = document.createElement('div');
  grid.className = 'card-grid cols-' + Math.min(sel.length, 4);
  grid.innerHTML = sel.map(k => {
    const d = editions[k];
    const mini = d.stats.concat(d.info).map(s =>
      `<div class="ed-mini"><div class="ed-mini-l">${s.label}</div><div class="ed-mini-v">${s.value}</div></div>`
    ).join('');
    const sections = d.sections.map(s => `
      <div class="ed-section">${s.label}</div>
      <div></div>
      ${s.items.map(i => `<div class="ed-feat">${i}</div>`).join('')}
    `).join('');
    const notInc = d.notIncluded.length
      ? `<div class="ed-not"><strong>不包含</strong>${d.notIncluded.join(' · ')}</div>`
      : '';
    return `<div class="ed-card ${k}">
      <div class="accent"></div>
      <div class="ed-card-body">
        <div class="ed-name">${d.name}</div>
        <div class="ed-sub">${d.cn} — ${d.sub}</div>
        <div class="ed-mini-grid">${mini}</div>
        <div class="ed-sections">${sections}</div>
        ${notInc}
      </div>
    </div>`;
  }).join('');
  wrap.appendChild(grid);

  // 下方：2+ 版本时附加 diff 面板（全宽，多列内嵌，不分左右）
  if (sel.length >= 2) {
    const featsByVer = {};
    sel.forEach(k => {
      const set = new Set();
      editions[k].sections.forEach(s => s.items.forEach(i => set.add(i)));
      featsByVer[k] = set;
    });
    const allFeats = new Set();
    sel.forEach(k => editions[k].sections.forEach(s => s.items.forEach(i => allFeats.add(i))));
    const featOwners = {};
    allFeats.forEach(f => { featOwners[f] = sel.filter(k => featsByVer[k].has(f)); });
    const allCommon = [...allFeats].filter(f => featOwners[f].length === sel.length);
    const onlyBy = {};
    sel.forEach(k => onlyBy[k] = []);
    [...allFeats].forEach(f => { if (featOwners[f].length === 1) onlyBy[featOwners[f][0]].push(f); });
    const counts = sel.map(k => ({ k, name: editions[k].name, cnt: featsByVer[k].size }));
    const maxCnt = Math.max(...counts.map(c => c.cnt));
    const minCnt = Math.min(...counts.map(c => c.cnt));
    const maxK = counts.find(c => c.cnt === maxCnt).k;
    const minK = counts.find(c => c.cnt === minCnt).k;

    // 多列：1 列「共有」+ N 列「各版本独占」
    let colsHTML = `<div class="diff-col">
      <div class="diff-col-h" style="--diff-color:#999;">全部共有 <span class="cnt">${allCommon.length}</span></div>
      <div class="diff-list">${
        allCommon.length === 0
          ? '<div class="diff-empty">无</div>'
          : allCommon.map(f => `<div class="item">${f}</div>`).join('')
      }</div>
    </div>`;

    sel.forEach(k => {
      const list = onlyBy[k];
      const color = 'var(--' + k + '-l)';
      const items = list.slice(0, 12).map(f => `<div class="item">${f}</div>`).join('');
      const more = list.length > 12 ? `<div class="more">等 ${list.length} 项</div>` : '';
      const empty = list.length === 0 ? '<div class="diff-empty">无独占</div>' : '';
      colsHTML += `<div class="diff-col">
        <div class="diff-col-h" style="--diff-color:${color};">仅 ${editions[k].name} <span class="cnt">${list.length}</span></div>
        <div class="diff-list">${items}${more}${empty}</div>
      </div>`;
    });

    const diff = document.createElement('div');
    diff.className = 'diff-panel';
    diff.innerHTML = `
      <div class="diff-title">差异分析 <span class="n">${sel.length} 版本</span></div>
      <div class="diff-summary">
        <strong>${editions[maxK].name}</strong> 功能最多（${maxCnt} 项） ·
        <strong>${editions[minK].name}</strong> 功能最少（${minCnt} 项） ·
        共同 <strong>${allCommon.length}</strong> 项
      </div>
      <div class="diff-cols">${colsHTML}</div>`;
    wrap.appendChild(diff);
  }
}

/**
 * renderTable  渲染对比表视图
 * 行 = 功能，列 = 选中版本
 * 分类行 .row-cat 分隔不同功能区
 * 单元格 ✓/✗ 用 .ic-y / .ic-n
 * 表格 min-width 防止列被压成单字符
 */
function renderTable() {
  const sel = order.filter(k => selected.has(k));
  const selIdx = sel.map(k => order.indexOf(k));
  const wrap = document.getElementById('table-view');
  const headers = sel.map(k => `<th class="${k}-h">${labels[k]}</th>`).join('');

  let lastCat = '';
  const rows = features.map(f => {
    let catRow = '';
    if (f.cat !== lastCat) {
      lastCat = f.cat;
      catRow = `<tr class="row-cat"><td colspan="${sel.length+1}">${f.cat}</td></tr>`;
    }
    const cells = selIdx.map((idx, i) => {
      const val = f.v[idx];
      const k = sel[i];
      if (typeof val === 'string') return `<td style="font-size:12px;color:#999;">${val}</td>`;
      if (val === 1) return `<td><span class="ic-y">&#10003;</span></td>`;
      return `<td><span class="ic-n">&#10007;</span></td>`;
    }).join('');
    return catRow + `<tr><td>${f.name}</td>${cells}</tr>`;
  }).join('');

  const infoRows = `
    <tr class="row-sep row-cat"><td colspan="${sel.length+1}">授权与定位</td></tr>
    <tr><td>授权方式</td>${sel.map(k => `<td style="font-size:11px;color:#888;">${editions[k].info[0].value}</td>`).join('')}</tr>
    <tr><td>适合人群</td>${sel.map(k => `<td style="font-size:11px;color:#888;">${editions[k].info[1].value}</td>`).join('')}</tr>
    <tr><td>获取渠道</td>${sel.map(k => `<td style="font-size:11px;color:#888;">${editions[k].info[2].value}</td>`).join('')}</tr>
  `;

  wrap.innerHTML = `<div class="table-wrap view-fade"><table>
    <thead><tr><th>功能 / 特性</th>${headers}</tr></thead>
    <tbody>${rows}${infoRows}</tbody>
  </table></div>`;
}

let wizardStep = 0;
let wizardScores = {};
let wizardAnswers = [];

/**
 * renderWizard  渲染推荐向导
 * 问答式：根据使用场景推荐最合适的版本
 * 状态：wizardStep（当前问题序号）、wizardHistory（已选答案）
 */
function renderWizard() {
  var wrap = document.getElementById('wizard-view');
  if (wizardStep >= quiz.length) {
    var sorted = Object.entries(wizardScores).sort(function(a, b) { return b[1] - a[1]; });
    var topKey = sorted[0][0];
    var d = editions[topKey];
    var reasons = [];
    if (topKey === 'home') reasons.push('你的需求以日常使用为主，不需要企业级功能');
    if (topKey === 'pro') reasons.push('你需要加密、虚拟化或域管理等进阶功能');
    if (topKey === 'ws') reasons.push('你的工作负载需要工作站级硬件支持（ReFS / 大内存 / 多路 CPU）');
    if (topKey === 'ent') reasons.push('你在企业域环境中，需要高级安全管控（Credential Guard / AppLocker）');
    if (topKey === 'edu') reasons.push('你处于教育场景，需要教育专属功能（Take Test / Intune 教育版）');
    if (topKey === 'pedu') reasons.push('你需要 K-12 教育设备的简化部署和管理');
    if (topKey === 'ltsc') reasons.push('你需要长期稳定、不频繁更新功能的系统环境');
    if (topKey === 'iot') reasons.push('你的设备是嵌入式/IoT 终端，需要 10 年支持和设备锁定');
    var scoreChips = sorted.slice(0, 4).map(function(e) {
      return '<span class="wiz-score-chip" style="border-color:var(--' + e[0] + ');color:var(--' + e[0] + '-l);">' + labels[e[0]] + ' ' + e[1] + '</span>';
    }).join('');
    wrap.innerHTML = '<div class="wizard-card view-fade">' +
      '<div class="wiz-result">' +
        '<div class="wiz-result-name" style="color:var(--' + topKey + '-l);">' + d.name + '</div>' +
        '<div class="wiz-result-sub">' + d.cn + ' \u2014 ' + d.sub + '</div>' +
        '<div class="wiz-scores">' + scoreChips + '</div>' +
        '<div class="wiz-result-reason">' +
          '<strong style="color:#ccc;">推荐理由</strong><br><br>' +
          reasons.map(function(r) { return '\u00b7 ' + r; }).join('<br>') + '<br><br>' +
          '<strong style="color:#ccc;">适合场景</strong><br>' + d.goodFor + '<br><br>' +
          '<strong style="color:#ccc;">授权方式</strong><br>' + d.info[0].value +
        '</div>' +
        '<button class="wiz-restart" onclick="wizardRestart()">重新测试</button>' +
      '</div>' +
    '</div>';
    return;
  }
  var q = quiz[wizardStep];
  var progress = (wizardStep / quiz.length) * 100;
  var opts = q.opts.map(function(o, i) {
    return '<button class="wiz-opt" onclick="wizardAnswer(' + i + ')">' +
      '<span class="wiz-opt-num">' + (i + 1) + '</span>' + o.label + '</button>';
  }).join('');
  wrap.innerHTML = '<div class="wizard-card view-fade">' +
    '<div class="wiz-progress"><div class="wiz-progress-bar" style="width:' + progress + '%;"></div></div>' +
    '<div class="wiz-step">问题 ' + (wizardStep + 1) + ' / ' + quiz.length + '</div>' +
    '<div class="wiz-q">' + q.q + '</div>' +
    '<div class="wiz-opts">' + opts + '</div>' +
    (wizardStep > 0 ? '<button class="wiz-back" onclick="wizardBack()">&#8592; 上一题</button>' : '') +
  '</div>';
}

/** wizardAnswer  选择当前问题的一个选项，进入下一步或出结果 */
function wizardAnswer(idx) {
  if (wizardAnswers[wizardStep] !== undefined) {
    var prev = quiz[wizardStep].opts[wizardAnswers[wizardStep]].s;
    for (var pk in prev) wizardScores[pk] = (wizardScores[pk] || 0) - prev[pk];
  }
  var scores = quiz[wizardStep].opts[idx].s;
  for (var sk in scores) wizardScores[sk] = (wizardScores[sk] || 0) + scores[sk];
  wizardAnswers[wizardStep] = idx;
  wizardStep++;
  renderWizard();
}

/** wizardBack  回到上一题 */
function wizardBack() {
  if (wizardStep === 0) return;
  wizardStep--;
  renderWizard();
}

/** wizardRestart  重置向导，回到第一题 */
function wizardRestart() {
  wizardStep = 0;
  wizardScores = {};
  wizardAnswers = [];
  renderWizard();
}

/* ─────────────────────────────────────────────
   Keyboard Shortcuts  键盘快捷键
   ─────────────────────────────────────────────
   1-5     切换视图（详情/卡片/对比表/时间线/向导）
   ← →     详情视图切换版本
   数字    向导中选择选项
   Backspace  向导回到上一步
   ⚠️ INPUT/TEXTAREA 聚焦时不响应
   ───────────────────────────────────────────── */
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (view === 'wizard') {
    var num = parseInt(e.key);
    if (wizardStep < quiz.length && num >= 1 && num <= quiz[wizardStep].opts.length) {
      wizardAnswer(num - 1);
    }
    if (e.key === 'Backspace' && wizardStep > 0) { e.preventDefault(); wizardBack(); }
    return;
  }
  if (e.key === '1') switchView('detail');
  else if (e.key === '2') switchView('cards');
  else if (e.key === '3') switchView('table');
  else if (e.key === '4') switchView('version');
  else if (e.key === '5') switchView('wizard');
  if (view === 'detail') {
    if (e.key === 'ArrowLeft') { e.preventDefault(); navDetail(order[(order.indexOf(detailKey) - 1 + order.length) % order.length]); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); navDetail(order[(order.indexOf(detailKey) + 1) % order.length]); }
  }
});

(function() {
  var landing = document.getElementById('landing');
  var colors = ['#378ADD','#7F77DD','#1D9E75','#17A2B8','#BA7517','#D4633A'];
  for (var i = 0; i < 18; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    var s = Math.random() * 3 + 2;
    p.style.width = s + 'px'; p.style.height = s + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (Math.random() * 18 + 12) + 's';
    p.style.animationDelay = (Math.random() * 20) + 's';
    landing.appendChild(p);
  }
})();

/** enterApp  从起始页进入应用（淡出动画 + 初始化渲染） */
function enterApp() {
  document.getElementById('landing').classList.add('hide');
  setTimeout(function() { document.getElementById('landing').style.display = 'none'; }, 600);
}

      <rect x="226" y="64" width="112" height="24" rx="8" fill="#f0edff"/><text x="282" y="80" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" fill="#7058d9">Compare editions</text>

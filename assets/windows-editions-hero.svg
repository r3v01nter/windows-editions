<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Windows Editions Guide</title>
  <desc id="desc">A Windows-inspired illustration with edition comparison cards for Windows 10 and Windows 11.</desc>
  <defs>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35a8f5"/><stop offset="1" stop-color="#0067c0"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6d5ce7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#255c9a" flood-opacity=".13"/></filter>
  </defs>
  <rect width="720" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="615" cy="78" r="112" fill="#fff" opacity=".35"/>
  <circle cx="90" cy="450" r="130" fill="#fff" opacity=".32"/>
